plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.knogscout.control'
    compileSdk 34

    defaultConfig {
        applicationId "com.knogscout.control"
        minSdk 21
        // 34: refresh() is never called any more (it discards the good cache),
        // so nothing needs the non-SDK interface exemption that targetSdk 28
        // bought - and Play Protect stops blocking the install.
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { debug { minifyEnabled false } }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
