plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.knogscout.control'
    compileSdk 34

    defaultConfig {
        applicationId "com.knogscout.control"
        minSdk 21
        // Deliberately 28: keeps BluetoothGatt.refresh() reachable under
        // Android's non-SDK interface rules. Sideload only.
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { debug { minifyEnabled false } }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
